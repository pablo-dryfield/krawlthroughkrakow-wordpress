<p>Planning a stag or hen celebration in Krakow? Choose a shared night with other travellers on the regular pub crawl, or tell us which group activities you would like to compare. Start with what suits the people in your group and leave time between plans.</p>
</template>
<template data-target=".et_pb_text_2 .et_pb_text_inner">
<p>The regular crawl starts at {{regularTime}} and is for participants aged {{minimumAge}} or older. Bringing valid ID is recommended. Read <a href="__KTK_HOME_URL__about-us/how-to-join/">how to join the Krakow pub crawl</a> for the meeting instructions, current inclusions and booking options. NYE has separate event arrangements.</p>
<p>Check venue entry and dress requirements before choosing outfits or activities. Ask about any private arrangements instead of assuming the regular public crawl includes exclusive space, guaranteed admission or priority entry.</p>
</template>
<template data-target=".et_pb_text_3 .et_pb_text_inner">
<p>Use the enquiry form below to share your dates, expected headcount, budget and activity shortlist. Include relevant access or dietary needs and identify one organiser to coordinate replies. The listed activities are enquiry options; ask what is available for your dates.</p>
<p>Your individual quote confirms minimum group requirements, private arrangements, booking lead times, inclusions, deposits, payment dates and cancellation terms. Check the total, duration, meeting details, transport and how guest-number changes are handled before paying.</p>
<p>Our team replies by email after reviewing your enquiry. Sending the form is a request to discuss your plans; it does not confirm a reservation, accommodation, airport transfer or activity booking.</p>
