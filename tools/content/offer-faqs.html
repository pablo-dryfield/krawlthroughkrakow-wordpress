<template data-target=".et_pb_text_1 .et_pb_text_inner">
  <p>Planning your night with {{brand}}? Find answers about booking, the regular meeting point, returning for another crawl and what to expect with the group.</p>
  <p>The regular offer includes a {{openBarHours}}-hour open bar, entry to {{venueRange}} bars and clubs, welcome shots, guides and a photographer. Check your selected date and any optional extras on the booking page. New Year's Eve has a separate offer and meeting arrangements.</p>
</template>
<template data-question="How much does the crawl cost?">
  <p>See <a href="__KTK_HOME_URL__store2/pub-crawl-28/#book">current prices and available dates for the regular pub crawl</a>. Check the inclusions and any selected extras before checkout; special events have their own offer.</p>
  <p>{{cashReturnInstructions}}</p>
  <p>{{onlineReturnInstructions}}</p>
</template>
<template data-question="How can I join?">
  <p><a href="__KTK_HOME_URL__store2/pub-crawl-28/#book">Choose your date and book online</a>, then keep your booking confirmation for the night. An enquiry message is not an automatic booking confirmation.</p>
  <p>The regular crawl is for guests aged <strong>{{minimumAge}} and over</strong>. Bringing a valid ID is recommended. Read <a href="__KTK_HOME_URL__about-us/how-to-join/">how to join</a> for meeting details and the return-visit discount procedure.</p>
</template>
<template data-question="Do you guys run every night?">
  <p>The regular crawl starts at {{regularTime}}. Check <a href="__KTK_HOME_URL__store2/pub-crawl-28/#book">bookable dates and availability</a> for the night you want to join.</p>
  <p>For New Year's Eve, use the <a href="__KTK_HOME_URL__new-years-eve/">separate NYE event</a>: groups start at {{nyeEarly}} or {{nyeLate}}, with meeting points to be announced.</p>
</template>
<template data-question="Where is your meeting point">
  <p>The regular meeting is at {{regularTime}} by {{meetingName}} ({{meetingShort}}) in {{meetingPlace}}. Look for the guides and their {{lookFor}}.</p>
  <p>Open the <a href="__KTK_HOME_URL__meeting-point/">meeting-point page</a> for directions and check your booking confirmation. NYE guests should follow the separate event's meeting updates.</p>
</template>
<template data-question="What if I'm late?">
  <p>Contact the team using the details in your booking confirmation or our <a href="__KTK_HOME_URL__contact/">contact page</a>. Ask where to join the group rather than relying on a bar or route from a previous night.</p>
</template>
<template data-question="What bars/clubs are we going?">
  <p>The regular crawl includes entry to {{venueRange}} bars and clubs. The route can vary from night to night, so follow your guides rather than planning around a guaranteed list of named venues.</p>
  <p>Our <a href="__KTK_HOME_URL__krakow-nightlife/">Krakow nightlife guide</a> covers wider options in the city; its recommendations are not a fixed crawl itinerary.</p>
</template>
<template data-question="How long is the Pub Crawl?">
  <p>The regular crawl starts at {{regularTime}}, with a {{openBarHours}}-hour open bar before continuing between venues. Ask your leader about that night's route and timings.</p>
  <p>A particular finishing time or a club staying open until the following morning is not part of the confirmed regular offer. Check the arrangements for the night you join.</p>
</template>
<template data-question="Do you stay close to the main square?">
  <p>Our regular meeting point is in the Old Town's Main Market Square. The route can vary, so stay with the guides between stops. If walking distance or a particular return plan matters to you, <a href="__KTK_HOME_URL__contact/">ask the team before booking</a>.</p>
</template>
<template data-question="What if I'm Alone?">
  <p>Solo travellers are welcome, as are friends and groups. The opening bar gives you time to meet fellow krawlers, and optional games can help break the ice. You can join in at your own pace.</p>
</template>
<template data-question="Is there a Dress Code?">
  <p>Choose an outfit for a night out and footwear you are comfortable walking in. If you plan fancy dress or a costume, ask the team about the night's venue entry requirements before you join and bring an alternative if needed.</p>
</template>
<template data-question="Where are your Photos?">
  <p>A photographer is part of the regular crawl. Ask the team about photos from the night you joined.</p>
  <p>You can also browse our <a href="https://www.facebook.com/krawlthroughkrakow/photos">Facebook photos</a>, <a href="https://www.instagram.com/krawlthroughkrakow/">Instagram</a> and <a href="__KTK_HOME_URL__gallery/">pub crawl gallery</a> to see nights with the group.</p>
</template>
<template data-question="Can I Read your Reviews?">
  <p>Yes. Read guests' experiences on <a href="{{googleReviews}}">Google</a>, <a href="{{tripadvisorReviews}}">Tripadvisor</a> and <a href="{{getyourguideReviews}}">GetYourGuide</a>. Compare what guests say about the experience and the inclusions that matter to your night.</p>
</template>
<template data-target=".et_pb_text_2 .et_pb_text_inner">
  <p>Join the regular crawl at {{regularTime}} by {{meetingShort}}, with a {{openBarHours}}-hour open bar and entry to {{venueRange}} venues. <a href="__KTK_HOME_URL__store2/pub-crawl-28/#book">Check dates, inclusions and current prices</a> before booking.</p>
  <p>For {{nyeEarly}} or {{nyeLate}} on New Year's Eve, follow the <a href="__KTK_HOME_URL__new-years-eve/">separate NYE details and meeting updates</a>.</p>
</template>
<template data-target=".et_pb_text_5 .et_pb_text_inner">
  <p><a href="__KTK_HOME_URL__store2/pub-crawl-28/#book">Book the regular pub crawl online</a> and keep your confirmation. Look for the {{lookFor}} at {{meetingShort}} for the regular {{regularTime}} meeting.</p>
  <p>Guests must be {{minimumAge}} or over; bringing a valid ID is recommended. For another night with us, speak with your leader about the confirmed return-visit procedure above.</p>
</template>
