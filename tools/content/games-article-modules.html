<template data-ktk-game-module="0"><h2 id="choosing-games">Bring your group together with a party game</h2></template>
<template data-ktk-game-module="1"><p><small>Originally published on 5 May 2020. Games and download links reviewed <time datetime="2026-11-14">14 November 2026</time>.</small></p><p>From KTK Drunken Jenga to quick card rounds and memory games, a shared activity gives the table something to get talking about. Explore our <a href="__KTK_HOME_URL__tag/drinking-games/">drinking-game ideas</a>, choose your equipment and get the group ready for the next round.</p><p>Need a quick starting point? Try the <a href="__KTK_HOME_URL__pub-crawl-drinking-games/">five-game shortlist</a>. Planning a night out in Krakow too? See <a href="__KTK_HOME_URL__about-us/how-to-join/">how to join our pub crawl</a>.</p><nav aria-label="Games guide contents"><details><summary>Contents</summary><ul><li><a href="#choosing-games">Choose your game</a></li><li><a href="#table-games">KTK favourites</a></li><li><a href="#card-games">Card games</a></li><li><a href="#no-equipment">Little or no equipment</a></li><li><a href="#more-choices">More group games</a></li><li><a href="#playing-in-krakow">Games and a night in Krakow</a></li><li><a href="#plan-your-evening">Plan your evening</a></li></ul></details></nav></template>
<template data-ktk-game-module="2"><h2 id="table-games">KTK favourites for the table</h2></template>
<template data-ktk-game-module="3"><p>Start with a game everyone can follow, explain the house rules and keep the first round simple. A tower of blocks, a deck of cards or a few good questions can give a new group plenty to talk about.</p><p>Choose a game that fits your table and the time you have. Short rounds make it easy to switch between games and keep the evening moving.</p></template>
<template data-ktk-game-module="4"><h3>KTK Drunken Jenga</h3></template>
<template data-ktk-game-module="5"><p>A tower of blocks, a group of friends and KTK's party prompts: Drunken Jenga is a fun activity to bring to the table before a night out. Take turns pulling a block, reading its prompt and placing it on top. Every move changes the tower, so even a confident player can find the next turn a little more interesting.</p><p>Download the <a href="__KTK_HOME_URL__wp-content/uploads/2020/04/Jenga.pdf">KTK Drunken Jenga rules (PDF, 47.8 MB)</a> for our game prompts. Set up your blocks, get the group around the table and see who can keep the tower standing.</p></template>
<template data-ktk-game-module="6"><h3>Quick team challenges</h3></template>
<template data-ktk-game-module="7"><p>Try a drawing round, a team quiz or naming a song from a clue. Set a short timer, keep score and swap teams between rounds to get different people working together.</p><p>For the activities on a particular night, check with the <a href="__KTK_HOME_URL__about-us/how-to-join/">Krawl Through Krakow team</a>. Our current booking information is the place to confirm the offer.</p></template>
<template data-ktk-game-module="8"><h3>Team quiz showdown</h3></template>
<template data-ktk-game-module="9"><p>Split into small teams and choose a few categories: travel, music, films or unusual general knowledge. Give each team the same time to answer and award a point for a correct response. Let the team with the best score choose the next category.</p></template>
<template data-ktk-game-module="10"><h3>Never have I ever</h3></template>
<template data-ktk-game-module="11"><p>One person begins with "Never have I ever..." and the answers reveal who has a story worth hearing. Travel mishaps, hobbies and surprising talents give you plenty of material for the next round.</p><p>Find ideas in our <a href="__KTK_HOME_URL__wp-content/uploads/2020/04/Never-have-i-ever-.pdf">KTK Never Have I Ever prompts (PDF)</a>. Keep a few questions ready, then let the conversation take over when an answer deserves a story.</p></template>
<template data-ktk-game-module="12"><h3>Tabletop target game</h3></template>
<template data-ktk-game-module="13"><p>Arrange target cups at each end of a suitable table and split into two teams. Take turns throwing a ball towards the other team's cups and score a point for each successful shot.</p><p>For a straightforward skill game, use empty cups and agree the number of turns before starting. Check that the table is available for the game and leave enough room around it for the players.</p></template>
<template data-ktk-game-module="14"><h2 id="card-games">Card games for a night with friends</h2></template>
<template data-ktk-game-module="15"><p>A deck of cards is easy to carry and gives you several games from the same small piece of kit. Pick your house rules, decide how ties work and deal the first round.</p><p>Try a quick guessing game to warm up, then move to bluffing or matching when everyone has settled into the rhythm.</p></template>
<template data-ktk-game-module="16"><h3>King's Cup</h3></template>
<template data-ktk-game-module="17"><p>Draw a card in turn and use its rank to choose the next rule or prompt. Categories, rhymes and a change in turn direction keep the table alert as the game develops.</p><p>Use the <a href="__KTK_HOME_URL__wp-content/uploads/2020/04/Kingscup-2.pdf">KTK King's Cup rules (PDF)</a> for our version, and keep the rule list handy for the next card.</p></template>
<template data-ktk-game-module="18"><h3>Higher or lower</h3></template>
<template data-ktk-game-module="19"><p>Reveal a card and ask the next player whether the following card will rank higher or lower. Decide how an equal rank works, then see how many correct guesses you can make in a row.</p><p>For a group round, move around the table after each guess and keep a running score. A streak makes every new card a little more suspenseful.</p></template>
<template data-ktk-game-module="20"><h3>Pyramid</h3></template>
<template data-ktk-game-module="21"><p>Lay cards face down in a small pyramid and deal the rest to the players. Reveal one pyramid card at a time; players with the same rank can put down a matching card for a point.</p><p>Decide how many matches count before you start. Working from the bottom row to the top gives the round a clear finish and leaves room for a rematch.</p></template>
<template data-ktk-game-module="22"><h3>Bluffing cards</h3></template>
<template data-ktk-game-module="23"><p>Take turns placing cards face down and announcing their rank, following the sequence your group has agreed. Other players can challenge the claim and turn the cards over.</p><p>If the player was bluffing, they take the pile; if the claim was true, the challenger takes it. The aim is to get rid of your cards, and a convincing poker face helps.</p></template>
<template data-ktk-game-module="24"><h3>Electricity</h3></template>
<template data-ktk-game-module="25"><p>Reveal cards around the table and look for a connection, such as the same rank or an adjacent number. Count the connected cards until someone breaks the chain.</p><p>Give a point for each connection and keep track of your longest run. Decide how aces connect before the first round.</p></template>
<template data-ktk-game-module="26"><h2 id="no-equipment">Little or no equipment</h2></template>
<template data-ktk-game-module="27"><p>No cards or blocks to hand? Try a naming round, a memory challenge or a few good questions. These games can start with almost no setup, making them useful while your group is getting ready for the evening.</p></template>
<template data-ktk-game-module="28"><h3>Five Second Rule</h3></template>
<template data-ktk-game-module="29"><p>Choose a category and challenge the next player to name three examples in five seconds. Three cities, three breakfast foods or three film titles sound easy until the timer starts.</p><p>Count correct answers and move to the next player. Keep the categories coming and see which question produces the most unexpected response.</p></template>
<template data-ktk-game-module="30"><h3>Most likely to</h3></template>
<template data-ktk-game-module="31"><p>Read a prompt such as "most likely to plan a spontaneous trip" or "most likely to remember every song lyric". Count down together and point to the person who fits the description.</p><p>The fun is in hearing why the group picked someone. Mix familiar habits with travel and music questions to keep the round lively.</p></template>
<template data-ktk-game-module="32"><h3>Cardboard prompt board</h3></template>
<template data-ktk-game-module="33"><p>Draw large spaces on a clean sheet of cardboard and fill them with prompts: name a film, draw a landmark or choose the next category. Use a counter to select a space and work your way around the board.</p><p>Bring some KTK ideas to your game with our downloadable rule sheets:</p><ul><li><a href="__KTK_HOME_URL__wp-content/uploads/2020/04/Jenga.pdf">KTK Drunken Jenga rules (PDF, 47.8 MB)</a></li><li><a href="__KTK_HOME_URL__wp-content/uploads/2020/04/5-second-rule-.pdf">KTK Five Second Rule prompts (PDF)</a></li><li><a href="__KTK_HOME_URL__wp-content/uploads/2020/04/Never-have-i-ever-.pdf">KTK Never Have I Ever prompts (PDF)</a></li></ul></template>
<template data-ktk-game-module="34"><h3>Heads or tails</h3></template>
<template data-ktk-game-module="35"><p>Pick a side, toss a coin and count your correct guesses over a set number of turns. Play head-to-head or let the whole table guess the same toss.</p><p>Keep a tally of the longest streak and see who can beat it. It is a quick game for the moments between longer rounds.</p></template>
<template data-ktk-game-module="36"><h2 id="more-choices">More group games</h2></template>
<template data-ktk-game-module="37"><p>Mix up the evening with a different kind of game. A skill challenge, a counting round and a music quiz give different people their chance to shine.</p></template>
<template data-ktk-game-module="38"><h3>Flip Cup</h3></template>
<template data-ktk-game-module="39"><p>Line up empty reusable cups on a stable table and split into teams. The first player flips their cup from the edge, trying to land it upside down, before the next teammate takes a turn.</p><p>Count successful landings or set a shared team target. A little cheering can make even a small table game feel like a tournament.</p></template>
<template data-ktk-game-module="40"><h3>Buzz</h3></template>
<template data-ktk-game-module="41"><p>Count around the group, replacing a chosen set of numbers with "buzz". Multiples of seven make a good starting point, then you can add another rule once everyone has the idea.</p><p>Start a new round after a mistake and see how far the group gets. The longer the sequence, the more concentration it takes.</p></template>
<template data-ktk-game-module="42"><h3>Music guessing round</h3></template>
<template data-ktk-game-module="43"><p>Give a song clue or play a short excerpt where music is permitted, then challenge the group to name the artist or track. Try a theme such as film soundtracks, holiday favourites or songs from one decade.</p><p>Play as teams and keep a score, or let the person who guesses correctly choose the next song.</p></template>
<template data-ktk-game-module="44"><h3>Night-out bingo</h3></template>
<template data-ktk-game-module="45"><p>Make a bingo grid of light moments from an evening out: hearing a favourite song, learning a new phrase or discovering a new food. Mark off the squares as the evening unfolds and compare your cards later.</p><p>Mix common moments with a few that are harder to find, then see who gets the first full row.</p></template>
<template data-ktk-game-module="46"><h2 id="playing-in-krakow">Games and a night in Krakow</h2></template>
<template data-ktk-game-module="47"><p>Pair your games with a plan for the evening. Explore our <a href="__KTK_HOME_URL__krakow-nightlife/">Krakow nightlife guide</a> for ideas, or look back at the <a href="__KTK_HOME_URL__2020-krakow-nightlife-guide/">2020 nightlife guide</a> for a snapshot of an earlier season.</p><p>For games away from your own space, check the venue's arrangements and keep the city's <a href="https://respectkrakow.um.krakow.pl/">Respect Krakow visitor guidance</a> in mind when planning where to meet.</p></template>
<template data-ktk-game-module="48"><h3>Start with a toast</h3></template>
<template data-ktk-game-module="49"><p>A toast can mark the start of the evening or a reunion with friends. Give each person a turn to name a highlight from the trip, then choose the first game for the table.</p><p>For a different round, have everyone add one word to a short group toast and see what the last person has to remember.</p></template>
<template data-ktk-game-module="50"><h3>Team target challenge</h3></template>
<template data-ktk-game-module="51"><p>For a throwing-game variation, use a suitable permitted space and a simple points target. Split into teams, agree the throwing line and give each player the same number of attempts.</p><p>Count points over several rounds, then move the target or change the distance for a rematch. Choose a space with room for the ball and the players.</p></template>
<template data-ktk-game-module="52"><h3>Truth or dare</h3></template>
<template data-ktk-game-module="53"><p>Take turns choosing a question or a light challenge. A funny travel story, a drawing task or an improvised performance gives the group something to react to.</p><p>Use a few prepared ideas to get started, then build your next round around the people and stories at the table.</p></template>
<template data-ktk-game-module="54"><h3>Challenge ideas</h3></template>
<template data-ktk-game-module="55"><ul><li>Draw a Krakow landmark for teammates to guess.</li><li>Name a film using three clues.</li><li>Hum the opening of a song.</li><li>Invent a short fictional travel story.</li><li>Give a one-minute speech about a completely ordinary object.</li></ul></template>
<template data-ktk-game-module="56"><h3>Conversation ideas</h3></template>
<template data-ktk-game-module="57"><ul><li>What is the most unexpected thing that happened on a trip?</li><li>Which place would you return to tomorrow?</li><li>What song reminds you of a good holiday?</li><li>What hobby would you like to learn?</li><li>Which food would you introduce to the rest of the group?</li></ul></template>
<template data-ktk-game-module="58"><h2 id="plan-your-evening">Keep the evening going</h2></template>
<template data-ktk-game-module="59"><p>A few rounds can be the start of a bigger night. See <a href="__KTK_HOME_URL__about-us/how-to-join/">how to join Krawl Through Krakow</a> for our current pub-crawl details, then bring your friends along for the evening.</p><p>Compare <a href="__KTK_HOME_URL__krakow-nightclubs/">Krakow nightclub choices</a> and the <a href="__KTK_HOME_URL__krakow-nightlife/">nightlife guide</a>, or browse our <a href="__KTK_HOME_URL__blog/">travel and nightlife articles</a>. The <a href="__KTK_HOME_URL__2020-krakow-nightlife-guide/">2020 guide</a> remains available for its historical perspective.</p></template>
