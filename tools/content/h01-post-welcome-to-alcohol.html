<p>Got a night-out story that still makes your friends laugh? The Big Prize Competition from Krawl Through Krakow is still on. Send us the funniest, most moving or simply most memorable story from your adventures, and let the team enjoy it too.</p>
<p>The competition runs in monthly rounds, judged by the KTK team at the end of each month. The winner must use the prize during the following month. Prize details were confirmed with the KTK team on <time datetime="2026-11-15">15 November 2026</time>. See <a href="#competition-how-to-enter">how to enter</a> below.</p>

<h2 id="competition-how-to-enter">How to enter</h2>
<p>Entrants must be 18 or over. Use the entry form below to send your name, email address and your own original story. There is no need to push your limits to have a story worth telling.</p>
<p>Each monthly round covers new entries received during that calendar month, ending on its last day in Kraków local time. The KTK team judges entries for originality and entertainment at the end of the month, and contacts the winner by email.</p>
<p>We ask for separate permission before publishing a submitted story. If you would prefer publication anonymously, tell us when we discuss permission. Avoid including someone else's private details without their permission.</p>
<h2 id="competition-prizes">What you can win</h2>
<ul><li>A EUR50 flight voucher.</li><li>Three nights in a hostel.</li><li>Free Pub Crawl access for the winner and a guest for their whole stay.</li><li>KTK T-shirts.</li></ul>
<p>The prize must be used in the calendar month following judging. For example, a winner selected in November must use the prize in December. Reply to the KTK team's email to arrange the flight voucher, hostel dates and other prize details for that month.</p>
<h2>Questions about the competition</h2>
<p>Have a question about the prize or your entry? <a href="__KTK_HOME_URL__contact/">Contact the KTK team</a>.</p>
<p>These updated entry instructions apply to new entries from 24 November 2026. They do not retrospectively change arrangements for an earlier entry; contact the KTK team if you submitted before this update.</p>
