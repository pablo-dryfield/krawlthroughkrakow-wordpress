<h2 id="memorial-location">How far is Auschwitz from Krakow?</h2>
<p>The Memorial is in O&#347;wi&#281;cim, west of Krakow. Plan your route to the Visitor Services Centre at <strong>55 Wi&#281;&#378;ni&oacute;w O&#347;wi&#281;cimia Street</strong>, where visits begin at the former Auschwitz I site. Use the <a href="https://www.auschwitz.org/en/visiting/getting-to-the-museum/">Memorial's transport information</a> to check the destination, rather than relying on a general town-centre stop.</p>
<p>Choose an arrival with room for delays and the recommended 30-minute check-in margin before your booked tour. A travel estimate is not a guaranteed arrival time.</p>
</template>
<template data-target="2">
<h2 id="memorial-entry">How much does it cost to go to Auschwitz?</h2>
<p>A personalized entry pass is required for both Auschwitz I and Auschwitz II-Birkenau. Individual visitors must reserve online through <a href="https://visit.auschwitz.org/?lang=en">the Memorial's official reservation system</a>; passes are not available at the entrance.</p>
<p>Unguided visits have limited free passes at designated times. Guided visits are paid. Check the <a href="https://www.auschwitz.org/en/visiting/guided-tours-for-individual-visitors/">current visit options</a> for language, availability and price. Free admission does not mean you can arrive without a reservation, and a transport ticket alone is not an entry pass.</p>
</template>
<template data-target="3">
<h2 id="memorial-transport">How do I get to Auschwitz?</h2>
<p>You can plan independent travel or choose a package with transport. Match the outbound journey to your reserved entry time, check the exact arrival stop and arrange the return journey too.</p>
<p>Auschwitz I and Auschwitz II-Birkenau are about 3.5 km apart. The Museum provides a shuttle between them; check the arrangements for your visit. The <a href="https://www.auschwitz.org/en/visiting/getting-to-the-museum/">official directions</a> also explain the visitor centre, station and parking locations.</p>
</template>
<template data-target="4">
<h2 id="memorial-bus">Bus to Auschwitz</h2>
<p>The Memorial links to Lajkonik services from Krakow to its car park. Consult the operator's <a href="https://www.lajkonikbus.pl/krakow-oswiecim.html">Krakow-O&#347;wi&#281;cim timetable</a> for the current route and stops, including Krakow MDA at Bosacka 18.</p>
<p>Confirm the service date, fare, boarding point, museum stop and return journey with the operator before booking. Allow for traffic rather than choosing a connection that arrives at the last minute.</p>
</template>
<template data-target="5">
<h2 id="memorial-train">Train to Auschwitz</h2>
<p>For rail travel, look for a connection to <strong>O&#347;wi&#281;cim</strong> on your chosen date. The railway station is about 1.5 km from the Visitor Services Centre, according to the <a href="https://www.auschwitz.org/en/visiting/getting-to-the-museum/">Museum's directions</a>.</p>
<p>Include that final transfer in your arrival plan. Check current rail services, fares and the return journey with the operator, and leave enough time between the train's arrival and your Museum entry slot.</p>
</template>
<template data-target="6">
<h2 id="memorial-tour-package">Tour company to Auschwitz</h2>
<p>A package can make travel arrangements simpler, but compare the written details before paying. Check whether it includes a named entry pass, a Museum guide-educator, transport between the two sites and the pickup and return arrangements you need.</p>
<p>Ask the operator to confirm the entry date, time, language and what happens if the arrangements change. Do not treat a low package price or a transport reservation as proof of Museum admission. Use the <a href="https://www.auschwitz.org/en/visiting/guided-tours-for-individual-visitors/">official visit information</a> to understand the available visit types.</p>
</template>

<h2 id="memorial-duration">How long do you need to visit Auschwitz?</h2>
<p>A standard guided visit takes approximately 3.5 hours. Add travel from Krakow, check-in, transfers and time for a break; the tour duration is not the total length of your day.</p>
<p>Leave room in your plans afterwards rather than rushing to another reservation. For other formats and availability, consult the <a href="https://www.auschwitz.org/en/visiting/guided-tours-for-individual-visitors/">Memorial's visit options</a>.</p>
</template>
<template data-target="8">
<h2 id="memorial-hours">Is Auschwitz open all year round?</h2>
<p>The Memorial's ordinary closure dates are 1 January, 25 December and Easter Sunday. Seasonal entrance hours vary, and temporary closures are possible. The published entrance schedule begins at 7:30 AM.</p>
<p>Check the <a href="https://www.auschwitz.org/en/visiting/opening-hours/">official opening hours</a> and your actual entry pass before travelling. Opening hours are not a promise of an available pass at every time, or permission to arrive at a different time from your reservation.</p>
</template>
<template data-target="9">
<h2 id="memorial-food">Is there food available to buy at Auschwitz?</h2>
<p>Plan meals, water and breaks as part of your travel day. Check current facilities and ask the Visitor Services Centre where you can stop for a break; do not assume refreshments are included in a transport package.</p>
<p>Follow the <a href="https://www.auschwitz.org/en/visiting/basic-information/">Museum's visitor guidance</a> and on-site instructions about what you may bring and where eating is permitted.</p>
</template>
<template data-target="10">
<h2 id="memorial-photography">Can I take photos at Auschwitz?</h2>
<p>The Museum generally permits personal photographs without flash or stands, with restrictions including the victims' hair room in Block 4 and the basements of Block 11. Follow signs and staff instructions; commercial photography needs prior approval.</p>
<p>Read the <a href="https://www.auschwitz.org/en/visiting/basic-information/">current photography guidance</a> and respect the dignity of the place and other visitors.</p>
</template>
<template data-target="11">
<h2 id="memorial-preparation">Is anything not permitted in Auschwitz?</h2>
<p>Check the <a href="https://www.auschwitz.org/en/visiting/basic-information/">visitor rules</a> before packing. The stated bag limit is 35 x 25 x 15 cm. Paid storage is available; check current arrangements rather than relying on an old locker price. Keep your named pass ready and check which identity or concession documents you need.</p>
<p>The Memorial advises against visits by children under 14. If you have access requirements, review its <a href="https://www.auschwitz.org/en/accessibility/">accessibility information</a> before choosing arrangements. Historic buildings and surfaces can be difficult to navigate.</p>
</template>
