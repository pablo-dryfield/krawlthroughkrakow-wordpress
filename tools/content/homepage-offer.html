<template data-target=".et_pb_text_2 .et_pb_text_inner > :first-child">KRAKOW PUB CRAWL SINCE {{since}}</template>
<template data-target=".et_pb_text_18 .et_pb_text_inner > :is(h2,h3)">{{brand}} since {{since}}</template>
<template data-target=".et_pb_text_22 .et_pb_text_inner > :is(h2,h3)">KRAKOW PUB CRAWL SINCE {{since}}</template>
<template data-target=".et_pb_text_3 .et_pb_text_inner">
  <p>A night out is better with people to share it with. Join {{brand}} for a guided Krakow pub crawl, from the first bar to the city's nightlife.</p>
  <p>The regular crawl includes a {{openBarHours}}-hour open bar, entry to {{venueRange}} bars and clubs, welcome shots, guides and a photographer. Explore the offer, pick a bookable date and meet your group.</p>
</template>
<template data-target=".et_pb_text_4 .et_pb_text_inner">
  <p>We've been bringing people together since {{since}}. The regular crawl starts at <strong>{{regularTime}}</strong> at {{meetingName}} ({{meetingShort}}) in {{meetingPlace}}. Read <a href="https://krawlthroughkrakow.com/about-us/how-to-join/">how to join</a> before heading out.</p>
</template>
<template data-target=".et_pb_text_5 .et_pb_text_inner">
  <p><strong><a href="https://krawlthroughkrakow.com/store2/pub-crawl-28/#book">Check dates, availability and current prices</a></strong> on the booking page. Special events can have different start times and meeting arrangements.</p>
  <p>The regular pub crawl is for guests aged <strong>{{minimumAge}} and over</strong>. Bringing a valid ID is recommended.</p>
  <p>Coming back for another night? For a cash return booking, speak with the pub crawl leader to confirm you joined a previous crawl.</p>
  <p>For online return bookings, show your previous booking confirmation to the leader to receive a discount code, or use the code shared in the previous day's WhatsApp group.</p>
</template>
<template data-target=".et_pb_text_8 .et_pb_text_inner">
  <p>Whether you're travelling solo, with a friend or as a group, a Krakow pub crawl brings you together for a shared night out. Our guides organise the route, and the opening bar gives you time to meet other travellers before moving on.</p>
  <p>Curious about the wider city? Explore our <a href="https://krawlthroughkrakow.com/krakow-nightlife/">Krakow nightlife guide</a>, or go straight to <a href="https://krawlthroughkrakow.com/store2/pub-crawl-28/#book">regular pub-crawl dates and tickets</a>.</p>
</template>
<template data-target=".et_pb_text_10 .et_pb_text_inner">
  <p>The regular crawl begins with a {{openBarHours}}-hour open bar, with spirits, beer and soft drinks. Settle in, meet your fellow krawlers and enjoy the first stop at your own pace.</p>
  <p>Optional upgrades, where available, are shown separately on the booking page so you can choose the night that's right for you.</p>
</template>
<template data-target=".et_pb_text_11 .et_pb_text_inner > :is(h2,h3)">Games, new people and a shared night out</template>
<template data-target=".et_pb_text_12 .et_pb_text_inner">
  <p>Games can help break the ice, but you don't have to join every round. Take part in what you enjoy, chat with the group or choose a soft drink.</p>
</template>
<template data-target=".et_pb_text_13 .et_pb_text_inner">
  <p>Entry to {{venueRange}} bars and clubs is included in the regular crawl. The route can vary, so it isn't a guaranteed list of particular venues. Follow the guides between stops and check with the team if you need help finding the group.</p>
</template>
<template data-target=".et_pb_text_15 .et_pb_text_inner">
  <p>Want a night out without choosing each stop yourself? Our guides bring the group between venues, with welcome shots included on arrival. A photographer is part of the regular offer; ask the team about photos from your night.</p>
  <p>For a particular music style or an independent night out, use the <a href="https://krawlthroughkrakow.com/krakow-nightlife/">nightlife guide</a> to explore your options. Recommended venues in our guides aren't a fixed pub-crawl itinerary.</p>
</template>
<template data-target=".et_pb_text_16 .et_pb_text_inner">
  <p>Keep your belongings with you, stay aware of the group and ask your guides if you need assistance. Join the games if you feel like it, and take the night at your own pace.</p>
  <p><strong>Local guides. New people. A night in Krakow.</strong></p>
</template>
<template data-target=".et_pb_blurb_8 .et_pb_module_header">{{venueRange}} DIFFERENT VENUES</template>
<template data-target=".et_pb_blurb_11 .et_pb_blurb_description"><p>Entry is included; the route can vary by night.</p></template>
<template data-target=".et_pb_blurb_12 .et_pb_blurb_description"><p>Meet fellow travellers through optional games.</p></template>
<template data-target=".et_pb_blurb_13 .et_pb_module_header">PROFESSIONAL GUIDES</template>
<template data-target=".et_pb_blurb_13 .et_pb_blurb_description"><p>Follow the guides between bars and clubs.</p></template>
<template data-target=".et_pb_text_24 .et_pb_text_inner">
  <p>{{brand}} has organised nights out since {{since}}. Meet new people, explore Krakow nightlife and let the guides lead the way between venues.</p>
  <p>Find out <a href="https://krawlthroughkrakow.com/about-us/how-to-join/">how to join the regular crawl</a> and what to expect at the meeting point. For New Year's Eve, use the <a href="https://krawlthroughkrakow.com/new-years-eve/">separate NYE offer and confirmed start times</a>.</p>
</template>
<template data-target=".et_pb_text_30 .et_pb_text_inner">
  <p>Come for the bars and clubs, stay for the people you meet. Our guides bring the group together for a shared Krakow night out.</p>
  <p>The regular meeting is at {{regularTime}} by {{meetingShort}}. Check the <a href="https://krawlthroughkrakow.com/meeting-point/">meeting-point directions</a> and your booking details before setting off.</p>
</template>
<template data-target=".et_pb_text_33 .et_pb_text_inner">
  <p><a href="https://krawlthroughkrakow.com/store2/pub-crawl-28/#book">Choose your date and book the regular pub crawl online</a>. Availability and the current price are shown before checkout.</p>
  <p>Look for the {{lookFor}} and the guides at {{meetingShort}} for the regular {{regularTime}} start. Keep your booking confirmation handy.</p>
  <p>New Year's Eve is a separate event with {{nyeEarly}} and {{nyeLate}} groups and meeting points to be announced. Check the <a href="https://krawlthroughkrakow.com/new-years-eve/">NYE details</a> rather than using the regular meeting instructions.</p>
</template>
