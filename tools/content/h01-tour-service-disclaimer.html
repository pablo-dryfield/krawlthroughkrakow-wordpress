<p style="text-align: left;" data-ktk-id-guidance-review="2026-11-15.operator-trust-1"><strong>1.</strong> Customers must be at least 18 years old. Bringing valid identification is recommended for this event.</p>
<p style="text-align: left;">2. Check the selected offer's current inclusions and booking terms before booking. The guide leads the group and provides joining and venue information. Purchases you make directly with a venue may have separate terms; this does not remove KTK's responsibility for its own services.</p>
<p style="text-align: left;">3. A night out can involve risks. Consider whether you can take part safely, follow reasonable safety instructions and venue rules, and tell the guide if you need assistance.</p>
<p style="text-align: left;">4. Respect other guests. Do not drink excessively or take part in dangerous activities. A guide may stop or restrict participation where reasonably necessary for safety. This statement does not decide your rights or remedies in a particular case.</p>
<p style="text-align: left;">KTK remains responsible for its services as required by applicable law. Nothing in this information excludes or restricts liability or consumer rights that cannot lawfully be excluded or restricted.</p>
<p style="text-align: left;">Thank you. We look forward to welcoming you.</p>
