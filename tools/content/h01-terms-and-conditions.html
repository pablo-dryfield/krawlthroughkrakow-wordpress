<p style="text-align: left;">Krawl Through Krakow is operated by the company identified above. These terms explain use of our website and how to contact us about our services.</p>
<h2 style="text-align: left;">Enquiries and bookings</h2>
<p style="text-align: left;">Send your preferred date, group size and requirements when asking about a group activity. We confirm availability, the format, inclusions and the individual quote with you. An enquiry is not a confirmed booking.</p>
<p style="text-align: left;">Before booking, check the selected offer's current price, date, inclusions and applicable booking terms. The terms supplied for your booking and any changes validly agreed with you continue to apply. This page does not replace agreed booking terms or create a new cancellation charge.</p>

<p style="text-align: left;">We use the details you provide to handle your enquiry, application or competition entry and contact you about it. Sending one of these forms does not automatically subscribe you to newsletters or other marketing. Marketing requires a separate choice.</p>
<p style="text-align: left;">Our <a href="__KTK_HOME_URL__privacy-policy/">Privacy Policy</a> explains our handling of personal data. Reading this website or sending a form is not blanket consent to unrelated processing. The KTK team handles privacy, access and deletion requests at <a href="mailto:pubthroughkrakow@gmail.com">pubthroughkrakow@gmail.com</a>.</p>
<h2 style="text-align: left;">Competition entries and submitted stories</h2>
<p style="text-align: left;">Read the current instructions on <a href="__KTK_HOME_URL__welcome-to-alcohol/">The Big Prize Competition</a> page before entering. The KTK team judges stories for originality and entertainment at the end of each month. The prize must be used in the following month, and the winner is contacted by email.</p>
<p style="text-align: left;">Sending a story allows us to read and assess it and contact you about your entry. It does not automatically give us permission to publish it. If we would like to publish your story, we agree that permission and attribution with you separately. You retain your rights in your submitted material.</p>

<p style="text-align: left;">Pub-crawl guests must be at least 18 years old. Bringing valid identification is recommended. Follow reasonable safety instructions and venue rules, respect other guests, and do not drink excessively or take part in dangerous activities. Tell the guide if you need assistance.</p>
