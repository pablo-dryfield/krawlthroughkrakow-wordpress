<p>A Krakow hen weekend should suit the bride and the whole group, whether you want food, a creative activity or an evening out. Browse the ideas below and <a href="#hen_do_form">send a hen-group enquiry</a> with the options you would like to compare.</p>
<h2>Make the plans clear before booking</h2>
<ul>
<li><strong>Your dates and group:</strong> share arrival and departure dates, the expected number of guests and any activities or meals already booked.</li>
<li><strong>The kind of celebration:</strong> explain your preferred pace, budget per person and anything you would rather leave out. Tell us about dietary or access needs relevant to your plans.</li>
<li><strong>Shared or private:</strong> the regular pub crawl brings together other travellers. If your group wants a private activity or space, ask what can be arranged rather than assuming exclusivity.</li>
<li><strong>The written details:</strong> your individual quote sets out the total, inclusions, minimum group requirements, private arrangements, booking lead times, deposits, payment dates and cancellation terms. Confirm duration, transport, meeting details and how headcount changes are handled.</li>
</ul>
<p>For a regular evening out, read <a href="__KTK_HOME_URL__about-us/how-to-join/">how the Krakow pub crawl works</a>. It starts at {{regularTime}}; participants must be {{minimumAge}} or older and bringing valid ID is recommended. Follow the separate event information for NYE.</p>
<p>Pick one organiser to coordinate replies and leave room between activities. Our team replies by email after reviewing your enquiry. An enquiry is a request to discuss the plans, not confirmation that a venue, time or private arrangement is reserved.</p>
