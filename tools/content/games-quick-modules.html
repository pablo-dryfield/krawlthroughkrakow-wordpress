<template data-ktk-game-module="0"><p><small>Games and download links reviewed <time datetime="2026-11-14">14 November 2026</time>.</small></p><p>KTK Drunken Jenga brings a wobbly tower and a stack of party prompts to the table. Pull a block, read the prompt and keep the tower standing while the rest of the group watches your next move. The taller it gets, the more suspense you have between turns.</p><p>Get our <a href="__KTK_HOME_URL__wp-content/uploads/2020/04/Jenga.pdf">KTK Drunken Jenga rules (PDF, 47.8 MB)</a>, set up the tower and bring your group together for a game full of conversation and unexpected moments. Find more ideas in our <a href="__KTK_HOME_URL__best-drinking-games/">KTK party-game guide</a>.</p></template>
<template data-ktk-game-module="1"><p>A deck of cards, a table and a group of friends are the starting point for King's Cup. Each card brings a new rule, from a quick category round to a rhyme or a change in direction.</p><p>Keep the rules where everyone can see them, draw a card in turn and see who can keep up with the changing game. Categories and rhymes are especially good for getting the whole table talking.</p></template>
<template data-ktk-game-module="2"><p>Split into teams and line up your cups on a table. Each player flips a cup from the edge, trying to land it upside down before the next teammate takes over.</p><p>For a simple skill round, use empty cups and count successful landings. A stable table and enough space make it easier to follow the action and cheer on your team.</p></template>
<template data-ktk-game-module="3"><p>Start a statement with "Never have I ever..." and discover which friends have a story to tell. Missed trains, surprising travel experiences and kitchen disasters can turn a simple question into a whole conversation.</p><p>Keep a few prompts ready so the next person has something to work with. The best moments often come from the story behind an answer.</p></template>
<template data-ktk-game-module="4"><p>Start with "I'm going on a picnic and I'm bringing..." and name an item. The next person repeats the list and adds something new. A perfectly ordinary picnic can quickly turn into a wonderfully strange collection as the round grows.</p><p>Try a theme such as food, travel essentials or things beginning with the same letter. This one needs no equipment, just a good memory. For the night out afterwards, see <a href="__KTK_HOME_URL__about-us/how-to-join/">how to join the Krawl Through Krakow pub crawl</a>.</p></template>
