<p style="text-align: left;">This Privacy Policy explains how Krawl Through Krakow handles personal data. The operator and registered contact details are shown above. We use enquiry and job-application details to handle the request you send us, and competition-entry details to administer the competition and contact entrants about it. Reading the website or submitting a form is not blanket consent to unrelated processing.</p>
<h2 style="text-align: left;" data-ktk-heading-origin="h3">How we handle personal data</h2>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.1<span>&nbsp;</span><strong>Definitions</strong>
</h3>
<p style="text-align: left;" data-ktk-operator-domain-review="2026-11-15.operator-trust-1"><strong>SERVICE</strong><span>&nbsp;</span>means the krawlthroughkrakow.com website operated by Krawl Through Krakow.</p>
<p style="text-align: left;"><strong>PERSONAL DATA</strong><span>&nbsp;</span>means data about a living individual who can be identified from those data (or from those and other information either in our possession or likely to come into our possession).</p>
<p style="text-align: left;"><strong>USAGE DATA</strong><span>&nbsp;</span>is data collected automatically either generated by the use of Service or from Service infrastructure itself (for example, the duration of a page visit).</p>
<p style="text-align: left;"><strong>COOKIES</strong><span>&nbsp;</span>are small files stored on your device (computer or mobile device).</p>
<p style="text-align: left;"><strong>DATA CONTROLLER</strong><span>&nbsp;</span>means a natural or legal person who (either alone or jointly or in common with other persons) determines the purposes for which and the manner in which any personal data are, or are to be, processed. For the purpose of this Privacy Policy, we are a Data Controller of your data.</p>
<p style="text-align: left;"><strong>DATA PROCESSORS (OR SERVICE PROVIDERS)</strong><span>&nbsp;</span>means any natural or legal person who processes the data on behalf of the Data Controller. We may use the services of various Service Providers in order to process your data more effectively.</p>
<p style="text-align: left;"><strong>DATA SUBJECT<span>&nbsp;</span></strong>is any living individual who is the subject of Personal Data.</p>
<p style="text-align: left;"><strong>THE USER</strong><span>&nbsp;</span>is the individual using our Service. The User corresponds to the Data Subject, who is the subject of Personal Data.</p>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.2<span>&nbsp;</span><strong>Information Collection and Use</strong>
</h3>
<p style="text-align: left;">We collect several different types of information for various purposes to provide and improve our Service to you</p>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.3<span>&nbsp;</span><strong>Types of Data Collected</strong>
</h3>
<p style="text-align: left;"><strong>Personal Data<br></strong>While using our Service, we may ask you to provide us with certain personally identifiable information that can be used to contact or identify you (“Personal Data”). Personally identifiable information may include, but is not limited to:0.1. Email address0.2. First name and last name0.3. Phone number0.4. Address, Country, State, Province, ZIP/Postal code, City0.5. Cookies and Usage DataSending an enquiry, job application or competition entry does not automatically subscribe you to marketing. Marketing requires a separate choice.</p>
<p style="text-align: left;"><strong>Usage Data<br></strong>We may also collect information that your browser sends whenever you visit our Service or when you access Service by or through any device (“Usage Data”).This Usage Data may include information such as your computer’s Internet Protocol address (e.g. IP address), browser type, browser version, the pages of our Service that you visit, the time and date of your visit, the time spent on those pages, unique device identifiers and other diagnostic data.When you access Service with a device, this Usage Data may include information such as the type of device you use, your device unique ID, the IP address of your device, your device operating system, the type of Internet browser you use, unique device identifiers and other diagnostic data.</p>
<p style="text-align: left;"><strong>Location Data<br></strong>We may use and store information about your location if you give us permission to do so (“Location Data”). We use this data to provide features of our Service, to improve and customize our Service.You can enable or disable location services when you use our Service at any time by way of your device settings.</p>
<p style="text-align: left;"><strong>Tracking Cookies Data<br></strong>We use cookies and similar tracking technologies to track the activity on our Service and we hold certain information.Cookies are files with a small amount of data which may include an anonymous unique identifier. Cookies are sent to your browser from a website and stored on your device. Other tracking technologies are also used such as beacons, tags and scripts to collect and track information and to improve and analyze our Service.You can instruct your browser to refuse all cookies or to indicate when a cookie is being sent. However, if you do not accept cookies, you may not be able to use some portions of our Service.Examples of Cookies we use:</p>
<p style="text-align: left;">0.1. Session Cookies: We use Session Cookies to operate our Service.</p>
<p style="text-align: left;">0.2. Preference Cookies: We use Preference Cookies to remember your preferences and various settings.</p>
<p style="text-align: left;">0.3. Security Cookies: We use Security Cookies for security purposes.</p>
<p style="text-align: left;">0.4. Advertising Cookies: Advertising Cookies are used to serve you with advertisements that may be relevant to you and your interests.</p>
<p style="text-align: left;">The information requested varies by form. Enquiries may ask for contact details, the preferred date, group size and the activity requested; job applications ask for the relevant application details; competition entries ask for a name, email address and story. Use the form labels to check what is requested, and avoid including unnecessary sensitive information in free-text messages.</p>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.4<span>&nbsp;</span><strong>Use of Data</strong>
</h3>
<p style="text-align: left;">Krawl Through Krakow uses the collected data for various purposes:</p>
<p style="text-align: left;">0.1. to provide and maintain our Service;</p>
<p style="text-align: left;">0.2. to notify you about changes to our Service;</p>
<p style="text-align: left;">0.3. to allow you to participate in interactive features of our Service when you choose to do so;</p>
<p style="text-align: left;">0.4. to provide customer support;</p>
<p style="text-align: left;">0.5. to gather analysis or valuable information so that we can improve our Service;</p>
<p style="text-align: left;">0.6. to monitor the usage of our Service;</p>
<p style="text-align: left;">0.7. to detect, prevent and address technical issues;</p>
<p style="text-align: left;">0.8. to fulfil any other purpose for which you provide it;</p>
<p style="text-align: left;">0.9. to carry out our obligations and enforce our rights arising from any contracts entered into between you and us, including for billing and collection;</p>
<p style="text-align: left;">0.10. to provide you with notices about your account and/or subscription, including expiration and renewal notices, email-instructions, etc.;</p>
<p style="text-align: left;">0.11. to provide marketing communications only where you have made a separate choice and the applicable requirements are met;</p>
<p style="text-align: left;">0.12. in any other way we may describe when you provide the information;</p>
<p style="text-align: left;">0.13. for any other purpose with your consent.</p>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.5<span>&nbsp;</span><strong>Retention of Data</strong>
</h3>
<p style="text-align: left;">We will retain your Personal Data only for as long as is necessary for the purposes set out in this Privacy Policy. We will retain and use your Personal Data to the extent necessary to comply with our legal obligations (for example, if we are required to retain your data to comply with applicable laws), resolve disputes, and enforce our legal agreements and policies.We will also retain Usage Data for internal analysis purposes. Usage Data is generally retained for a shorter period, except when this data is used to strengthen the security or to improve the functionality of our Service, or we are legally obligated to retain this data for longer time periods.</p><p style="text-align: left;">There is no single fixed retention period for every type of record. Retention must remain tied to the relevant purpose and any necessary legal or claim-related requirement; it is not an unlimited keep-forever policy. Closing an enquiry does not itself delete its correspondence. Contact the KTK team for the retention criteria relevant to your request.</p>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.6<span>&nbsp;</span><strong>Transfer of Data</strong>
</h3>
<p style="text-align: left;">We use website-hosting, enquiry-management and email services to handle requests. These services may involve processing outside the European Economic Area. Contact the KTK team at <a href="mailto:pubthroughkrakow@gmail.com">pubthroughkrakow@gmail.com</a> for information about the locations and arrangements relevant to your data. Submitting a form does not itself give consent to a restricted international transfer.</p>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.7<span>&nbsp;</span><strong>Disclosure of Data</strong>
</h3>
<p style="text-align: left;">We may disclose personal information that we collect, or you provide:</p>
<p style="text-align: left;">0.1. Disclosure for Law Enforcement.Under certain circumstances, we may be required to disclose your Personal Data if required to do so by law or in response to valid requests by public authorities.</p>
<p style="text-align: left;">0.2. Business Transaction.If we or our subsidiaries are involved in a merger, acquisition or asset sale, your Personal Data may be transferred.</p>
<p style="text-align: left;">0.3. Other cases. We may disclose your information also:<br>0.3.1. to our subsidiaries and affiliates;0.3.2. to contractors, service providers, and other third parties we use to support our business;0.3.3. to fulfil the purpose for which you provide it;0.3.4. for the purpose of including your company’s logo on our website;0.3.5. for any other purpose disclosed by us when you provide the information;0.3.6. with your consent in any other cases;0.3.7. if we believe disclosure is necessary or appropriate to protect the rights, property, or safety of the Company, our customers, or others.</p>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.8<span>&nbsp;</span><strong>Security of Data</strong>
</h3>
<p style="text-align: left;">The security of your data is important to us but remember that no method of transmission over the Internet or method of electronic storage is 100% secure. While we strive to use commercially acceptable means to protect your Personal Data, we cannot guarantee its absolute security.</p>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.9<span>&nbsp;</span><strong>Service Providers</strong>
</h3>
<p style="text-align: left;">We may employ third party companies and individuals to facilitate our Service (“Service Providers”), provide Service on our behalf, perform Service-related services or assist us in analysing how our Service is used.These third parties have access to your Personal Data only to perform these tasks on our behalf and are obligated not to disclose or use it for any other purpose.</p>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.10<span>&nbsp;</span><strong>Analytics</strong>
</h3>
<p style="text-align: left;">We may use third-party Service Providers to monitor and analyze the use of our Service.</p>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.11<span>&nbsp;</span><strong>CI/CD tools</strong>
</h3>
<p style="text-align: left;">We may use third-party Service Providers to automate the development process of our Service.</p>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.12<span>&nbsp;</span><strong>Behavioural Re-marketing</strong>
</h3>
<p style="text-align: left;">We may use re-marketing services to advertise on third party websites to you after you visited our Service. We and our third-party vendors use cookies to inform, optimise and serve ads based on your past visits to our Service.</p>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.13<span>&nbsp;</span><strong>Payments</strong>
</h3>
<p style="text-align: left;">We may provide paid products and/or services within Service. In that case, we use third-party services for payment processing (e.g. payment processors).We will not store or collect your payment card details. That information is provided directly to our third-party payment processors whose use of your personal information is governed by their Privacy Policy. These payment processors adhere to the standards set by PCI-DSS as managed by the PCI Security Standards Council, which is a joint effort of brands like Visa, Mastercard, American Express and Discover. PCI-DSS requirements help ensure the secure handling of payment information.</p>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.14<span>&nbsp;</span><strong>Links to Other Sites</strong>
</h3>
<p style="text-align: left;">Our Service may contain links to other sites that are not operated by us. If you click a third party link, you will be directed to that third party’s site. We strongly advise you to review the Privacy Policy of every site you visit.We have no control over and assume no responsibility for the content, privacy policies or practices of any third party sites or services.</p>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.15<span>&nbsp;</span><strong>Children’s Privacy</strong>
</h3>
<p style="text-align: left;">Our Services are not intended for use by children under the age of 18 (“Child” or “Children”). We do not knowingly collect personally identifiable information from Children under 18. If you become aware that a Child has provided us with Personal Data, please contact us. If we become aware that we have collected Personal Data from Children without verification of parental consent, we take steps to remove that information from our servers.</p>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.16<span>&nbsp;</span><strong>Changes to This Privacy Policy</strong>
</h3>
<p style="text-align: left;">We may update our Privacy Policy from time to time. We will notify you of any changes by posting the new Privacy Policy on this page.We will let you know via email and/or a prominent notice on our Service, prior to the change becoming effective and update “effective date” at the top of this Privacy Policy.You are advised to review this Privacy Policy periodically for any changes. Changes to this Privacy Policy are effective when they are posted on this page.</p>
<h3 style="text-align: left;" data-ktk-heading-origin="h4">0.17<span>&nbsp;</span><strong>Contact Us</strong>
</h3>
<p style="text-align: left;">The KTK team handles privacy, access and deletion requests at <a href="mailto:pubthroughkrakow@gmail.com">pubthroughkrakow@gmail.com</a>. Depending on the processing and the conditions under applicable law, your rights include access, correction, erasure, restriction, portability, objection and withdrawal of consent where consent is used. You can complain to a data-protection supervisory authority, including the President of the Polish Personal Data Protection Office (UODO). A deletion request does not require records to be erased where there is an applicable legal exception.</p>
