<template data-ktk-city-module="0"><h2 id="weekend-plan">A flexible weekend in Krakow</h2></template>
<template data-ktk-city-module="1">
<p>Use these 15 daytime ideas and a night out to build your own weekend, not as a promise to fit every ticketed attraction into two days. Keep the Old Town stops together, allow a separate stretch for Kazimierz and Podgorze, and leave room for meals, queues and the journey home.</p>
<p><small>Visitor information checked <time datetime="2026-11-14">14 November 2026</time>. Check opening, admission and transport for your dates. For arrival and accommodation, use our <a href="__KTK_HOME_URL__travel-krakow-your-comprehensive-city-guide/">city logistics guide</a>.</small></p>
<template data-ktk-city-contents></template>
</template>
<template data-ktk-city-module="2"><h2 id="sightseeing-route">Sightseeing: group nearby stops together</h2></template>
<template data-ktk-city-module="3"><h3 id="main-square">1. Main Market Square</h3></template>
<template data-ktk-city-module="4">
<p>Start around the Main Market Square and the Cloth Hall, then decide which interiors you want to visit rather than buying every ticket. Keep your evening meeting instructions separate from daytime sightseeing: <a href="__KTK_HOME_URL__about-us/how-to-join/">How to Join</a> has the current KTK arrangements.</p>
<h3 id="planty-walk">2. A Planty walk</h3>
<p>Use part of the <a href="https://www.krakow.pl/instcbi/306312/inst/144486/2751/Planty-krakowskie.html">Planty park</a> for a break around the Old Town. Choose a short section that fits your route instead of feeling you need to complete a whole circuit.</p>
<h3 id="st-marys-visit">3. St Mary's Basilica</h3>
<p>While you are around the square, decide whether to include a visitor tour of St Mary's Basilica. Check the <a href="https://mariacki.com/en/tours-of-the-basilica/">parish's visitor information</a> for the tourist entrance, admission and hours; services and tourist visits have different arrangements.</p>
</template>
<template data-ktk-city-module="5"><h3 id="wawel-visit">4. Wawel Castle and the hill</h3></template>
<template data-ktk-city-module="6"><p>Choose whether you want an outdoor look around or a particular exhibition. Check <a href="https://wawel.krakow.pl/en/explore">Wawel's official visitor information</a> for the route, entrance time and tickets. Castle exhibitions and the cathedral have separate arrangements; do not assume access to every interior comes with a walk on the hill.</p></template>
<template data-ktk-city-module="7"><h3 id="vistula-walk">5. A Vistula-side walk</h3></template>
<template data-ktk-city-module="8"><p>After Wawel, a riverside section can give the day a slower pace before another museum or a meal. Pick the distance around your group and the weather, keep clear of cycle traffic and leave enough time to get to any reserved entry.</p></template>
<template data-ktk-city-module="9"><h3 id="kazimierz-visit">6. Kazimierz</h3></template>
<template data-ktk-city-module="10">
<p>Give Kazimierz its own part of the day rather than treating it as a quick detour. The <a href="https://galiciajewishmuseum.org/en/visit/city-tours/">Galicia Jewish Museum's heritage routes</a> are a useful starting point for understanding the area; check admission and visiting arrangements for individual sites.</p>
<h3 id="podgorze-remembrance">7. Podgorze and Ghetto Heroes Square</h3>
<p>Ghetto Heroes Square is in Podgorze, across the river, not in Kazimierz. If you include it, allow time for that distinct area and approach memorial sites respectfully. Do not confuse a walk through the neighbourhood with a booked museum visit.</p>
</template>
<template data-ktk-city-module="11"><h3 id="town-hall-tower">8. Town Hall Tower</h3></template>
<template data-ktk-city-module="12"><p>This is another option around the Main Market Square, not a compulsory extra after every other museum. Check the <a href="https://www.muzeumkrakowa.pl/en/branches/town-hall-tower">museum's current tower page</a> for admission, opening and access information. Choose it around your interests and ability to manage the visit rather than relying on an old description of the upper floors.</p></template>
<template data-ktk-city-module="13"><h2 id="food-stops">Food and drink: leave time between plans</h2></template>
<template data-ktk-city-module="14"><h3 id="pierogi-stop">9. A pierogi meal</h3></template>
<template data-ktk-city-module="15"><p>Make room for a proper meal and compare fillings, portions and toppings before ordering. Sharing several types can suit a group, but ask about ingredients and dietary requirements individually. Our <a href="__KTK_HOME_URL__best-places-to-eat/">food guide</a> has more starting ideas; check the venue's current menu.</p></template>
<template data-ktk-city-module="16"><h3 id="okraglak-stop">10. Okraglak and Plac Nowy</h3></template>
<template data-ktk-city-module="17"><p>Plac Nowy in Kazimierz is a convenient place to look for a zapiekanka around the central Okraglak building. Compare the stalls' actual menus and portions. Do not assume the same vendor, toppings or queue will be there at every hour, or that one person's favourite must be everyone's.</p></template>
<template data-ktk-city-module="18"><h3 id="food-truck-stop">11. A food-truck stop</h3></template>
<template data-ktk-city-module="19"><p>Food trucks can offer different choices within one group. Choose a current location near your route and check who is serving that day, so you can compare menus without spending the afternoon travelling between vendors. Leave enough time for food before <a href="__KTK_HOME_URL__about-us/how-to-join/">joining the pub crawl</a>, rather than ordering just before a scheduled start.</p></template>
<template data-ktk-city-module="20"><h3 id="tasting-choice">12. An organised tasting or activity</h3></template>
<template data-ktk-city-module="21"><p>If a guided tasting suits your group, compare the current <a href="__KTK_HOME_URL__store2/polish-vodka-tasting-44/#book">Polish vodka tasting</a> with other <a href="__KTK_HOME_URL__other-tours/">day activities</a>. Read the inclusions, tasting format, date and joining instructions before booking, and check whether food is included or should be arranged separately. For more inspiration, browse the existing <a href="__KTK_HOME_URL__tag/to-do-list/">things-to-do articles</a>.</p></template>
<template data-ktk-city-module="22"><h2 id="shopping-choices">Shopping: choose a useful stop, not another checklist</h2></template>
<template data-ktk-city-module="23"><h3 id="galeria-stop">13. Galeria Krakowska</h3></template>
<template data-ktk-city-module="24"><p>If shopping or an indoor break fits your plans, check <a href="https://www.galeriakrakowska.pl/en">Galeria Krakowska's operator site</a> for shops and current hours, including your particular Sunday or holiday. It is on Pawia Street by the main station. Do not build a tight departure around an assumed opening time or an old shop count.</p></template>
<template data-ktk-city-module="25"><h3 id="cloth-hall-stop">14. The Cloth Hall</h3></template>
<template data-ktk-city-module="26"><p>Combine a look at the Cloth Hall's trading area with the Main Market Square rather than making a separate cross-city journey. Compare souvenirs before buying. Trading stalls, the upstairs gallery and Rynek Underground are different experiences with their own visiting arrangements.</p></template>
<template data-ktk-city-module="27"><h3 id="nowy-kleparz-stop">15. Nowy Kleparz</h3></template>
<template data-ktk-city-module="28"><p>For a market alternative, check the <a href="https://kleparz.krakow.pl/">Nowy Kleparz operator's information</a> and choose a visit around the traders and products you want. Nowy Kleparz is distinct from Stary Kleparz; save the correct location rather than assuming the names refer to the same market. Ask before photographing people or stalls.</p></template>
<template data-ktk-city-module="29"><h2 id="weekend-nightlife">16. A Krakow night out</h2></template>
<template data-ktk-city-module="30">
<p>Choose an evening that fits your group and the following day's plans. Our <a href="__KTK_HOME_URL__krakow-nightlife/">nightlife guide</a> helps compare bars, music and clubs; check the actual event and admission conditions.</p>
<p>For an organised social night, read <a href="__KTK_HOME_URL__about-us/how-to-join/">Krawl Through Krakow's joining information</a> and check the current <a href="__KTK_HOME_URL__store2/pub-crawl-28/#book">pub-crawl booking page</a>. The regular crawl is for ages {{minimumAge}} and over; a valid ID is recommended. Keep time for dinner and your return transport, and avoid booking an early departure against an evening you have not planned.</p>
</template>
