<p>Organising a Krakow trip for a university society, sports team or group of friends? Start with your dates, headcount and budget, then use the <a href="#et_pb_contact_form_0">student-trip enquiry form</a> to explain what your group wants to do.</p>
<h2>Give your organiser a useful starting point</h2>
<ul>
<li><strong>Who is travelling:</strong> tell us the group size, age range and whether numbers are provisional. Include your society or university and one contact person.</li>
<li><strong>Your timetable:</strong> share arrival and departure dates, fixed commitments and the time you want available for sightseeing, meals and group activities.</li>
<li><strong>Your budget and priorities:</strong> give a budget per person and explain what it should cover. Ask which costs, transport and extras are included in any proposal.</li>
<li><strong>Before confirming:</strong> check availability, minimum numbers, private or shared arrangements, payment deadlines, cancellation terms and the process for changing the headcount.</li>
</ul>
<p>The regular <a href="__KTK_HOME_URL__about-us/how-to-join/">Krakow pub crawl</a> is an evening option for guests aged {{minimumAge}} and over; bringing valid ID is recommended. It starts at {{regularTime}} and is a shared night with other travellers, not an automatically private student event. NYE has separate arrangements.</p>
<p>For other plans, <a href="__KTK_HOME_URL__other-tours/">compare the current tour options</a>. An enquiry does not reserve places or guarantee a student discount; confirm the selected offer and its terms before collecting money from the group.</p>
</template>
