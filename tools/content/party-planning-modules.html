<template data-ktk-party-module="3"><h2 id="before-you-go">Before you go</h2></template>
<template data-ktk-party-module="4"><h3 id="compare-the-crawl">Compare a crawl with your own plans</h3><p>An organised crawl can make planning simpler, but it cannot guarantee a risk-free night or admission under every circumstance. Read the actual inclusions and conditions rather than relying on this article's old offer. See <a href="__KTK_HOME_URL__about-us/how-to-join/">how to join KTK</a> for the current booking route.</p></template>
<template data-ktk-party-module="5"><h3 id="skip-drinking-challenges">Skip drinking challenges</h3><p>High-strength shots, speed drinking and drinking to prove yourself are not things you need to complete. An old challenge or photograph is not a recommendation to repeat it. You can decline, choose an alcohol-free drink or leave without a contest or an explanation.</p></template>
<template data-ktk-party-module="6"><h3 id="explore-kazimierz">Give Kazimierz its own time</h3><p>Compare the setting and music you want rather than assuming every night has to stay around the Main Market Square. The <a href="__KTK_HOME_URL__krakow-bars-jewish-quarter/">Kazimierz bar guide</a> is a starting point for ideas, not a live programme. Allow time for the journey and check the actual venue before setting off.</p></template>
<template data-ktk-party-module="7"><p><small>Original archive-photo caption: &quot;Bar staff, Mr Vavelsky&quot;. This is not a current staffing or venue-status statement.</small></p></template>
<template data-ktk-party-module="8"><h3 id="read-the-menu">Read the menu before ordering</h3><p>Check the drink, serving size and price you are agreeing to. Ask about an unfamiliar item and confirm the amount before paying. Local branding does not automatically mean the lowest price, and a suggestion from somebody else does not oblige you to order it.</p></template>
<template data-ktk-party-module="9"><p><small>Original archive-photo caption: &quot;Four Music Club&quot;. Check current operators and programmes separately.</small></p></template>
<template data-ktk-party-module="10"><h3 id="choose-your-stops">Choose stops, not a target total</h3><p>You do not need to visit as many bars as possible to have a worthwhile night. Leave room to stay somewhere you enjoy, change direction or finish early. If friends split up, agree how to contact one another and keep an independent way back.</p></template>
<template data-ktk-party-module="11"><h3 id="check-events">Check the actual event</h3><p>Use the venue or organiser's current listing for music, doors, ticketing and entry conditions. Our <a href="__KTK_HOME_URL__krakow-live-music/">live-music guide</a> and <a href="__KTK_HOME_URL__krakow-techno-clubs/">techno guide</a> help compare options; neither guarantees that a particular artist or night is running.</p></template>
<template data-ktk-party-module="12"><h3 id="set-a-budget">Set your own budget</h3><p>Decide what you want to spend on entry, food, drinks and the return journey. The <a href="__KTK_HOME_URL__wheres-the-cheap-places-to-drink-in-krakow/">budget-drinks guide</a> labels dated menu examples rather than promising the old one-euro prices. Check the menu at the location you actually visit.</p></template>
<template data-ktk-party-module="13"><h3 id="plan-something-to-eat">Plan something to eat</h3><p>Check a food venue's current service and ordering arrangements before depending on it late at night. An old mention of a 24-hour kitchen is not proof that it is still open. Food is part of planning your evening, not a way to make a drinking challenge safe.</p></template>
<template data-ktk-party-module="14"><p><small>Original archive-photo caption: &quot;Upside down shot, Krawl Through Krakow&quot;. Retained as historical material, not a challenge recommendation.</small></p></template>
<template data-ktk-party-module="15"><h3 id="optional-games">Keep games optional</h3><p>Ask whether everyone wants to play, allow people to pass and agree what happens with photographs. Do not use forfeits, prizes or group pressure to make someone drink or participate. A social game can use points or another non-drinking format.</p></template>
<template data-ktk-party-module="16"><h3 id="choose-your-drink">Choose what you want to drink</h3><p>Choose by your own preferences and check the menu. You do not owe anyone a shot, a round or an explanation for choosing an alcohol-free option. Read the <a href="https://www.gov.uk/foreign-travel-advice/poland/safety-and-security">official Poland travel guidance</a> about unattended drinks and unfamiliar offers.</p></template>
<template data-ktk-party-module="17"><h3 id="food-options">Check food options directly</h3><p>If you want to try a milk bar or another Polish-food venue, check its current menu, location and opening information. Allow for dietary and access needs. An old recommendation is not a current price, availability promise or hangover remedy.</p></template>
<template data-ktk-party-module="18"><h3 id="tips-and-service">Check service charges</h3><p>Look at the bill and ask about an item or charge you do not understand. If you choose to tip, make that your own decision rather than treating it as a requirement to join a group or receive respectful service.</p></template>
<template data-ktk-party-module="19"><h2 id="while-you-are-out">While you are out</h2></template>
<template data-ktk-party-module="20"><h3 id="payment-options">Choose suitable payment options</h3><p>Check what the venue accepts and keep a backup appropriate to your plans. Neither cash nor a card makes an unclear offer trustworthy. Review the amount and currency shown before approving a payment and keep the receipt for what you agreed.</p></template>
<template data-ktk-party-module="21"><h3 id="respect-public-spaces">Respect public spaces</h3><p>The city's <a href="https://respectkrakow.um.krakow.pl/">Respect Krakow guidance</a> asks visitors not to drink alcohol in public places, leave litter or make noise after 22:00. Follow posted arrangements rather than assuming a bar's outdoor area makes every nearby space part of the venue.</p></template>
<template data-ktk-party-module="22"><h3 id="venue-staff">Treat venue staff respectfully</h3><p>Read the entry conditions and follow reasonable instructions. If you disagree or no longer want to stay, step away and ask for clarification without escalating a confrontation. A booking does not remove venue rules, and no visitor should be told to accept threats or mistreatment as part of the experience.</p></template>
<template data-ktk-party-module="23"><h3 id="unfamiliar-offers">Pause at unfamiliar offers</h3><p>A street invitation or a promised free item does not explain all the costs and conditions. Check the actual venue and terms before committing. The <a href="https://www.gov.uk/foreign-travel-advice/poland/safety-and-security">FCDO's travel advice</a> discusses nightclub bills and drink-spiking risks; going with a group does not remove those risks.</p></template>
<template data-ktk-party-module="24"><h3 id="costume-conditions">Check costume conditions</h3><p>Ask the venue about clothing or costume requirements before you travel. Our <a href="__KTK_HOME_URL__stag-do-costume/">costume guide</a> covers practical choices and respect for others. Do not treat a funny outfit, a group booking or an old photograph as guaranteed admission.</p></template>
<template data-ktk-party-module="25"><h3 id="your-own-pace">Keep your own pace</h3><p>Stopping, sitting out or choosing something else does not spoil the night. Let friends make their own decisions instead of treating intoxication as a group goal. If your plans stop working for you, change them; you do not need to stay until the last venue.</p></template>
<template data-ktk-party-module="26"><h3 id="dress-for-the-journey">Dress for the journey too</h3><p>Check the weather and think about walking, waiting and getting home as well as being inside. Confirm cloakroom arrangements directly rather than assuming every venue has one. Do not leave essential clothing behind because an old article promises that it will be warm underground.</p></template>
<template data-ktk-party-module="27"><h3 id="urgent-help">Know how to ask for urgent help</h3><p>A serious concern is not a challenge to push through or a reason to worry about embarrassing the group. For an emergency requiring immediate help in Poland, call <a href="tel:112">112</a>. The <a href="https://respectkrakow.um.krakow.pl/">municipal visitor information</a> lists that emergency number. This guide is not medical advice or a treatment protocol.</p></template>
<template data-ktk-party-module="28"><h3 id="choose-by-taste">Choose by taste, not pressure</h3><p>You can try something local without ordering alcohol, buying the strongest option or matching another person's spending. Ask about what interests you and decline what does not. No brand or price is proof that a drink suits you.</p></template>
<template data-ktk-party-module="29"><h3 id="next-day-plans">Leave room for the next day</h3><p>Plan the following day around the actual visit and your ability to participate respectfully. For the Memorial, use its own rules and our <a href="__KTK_HOME_URL__all-you-need-to-know-about-visiting-auschwitz/">official-source visitor guide</a>. Do not treat a difficult historical site as a recovery activity or assume a late night leaves every other booking practical.</p></template>
