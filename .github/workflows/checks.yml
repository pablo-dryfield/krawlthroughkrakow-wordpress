name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_private_engine_fixture:
        description: Run the full actual-inventory private engine fixture locally in CI
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ inputs.full_private_engine_fixture || false }}
  cancel-in-progress: true

jobs:
  quality:
    name: Offline Tests and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: staging/wp-content/plugins/ktk-storefront/frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check tracked-file policy and build inputs
        run: python tools/check-repository.py
      - name: Install locked storefront dependencies
        run: npm ci --prefix staging/wp-content/plugins/ktk-storefront/frontend
      - name: Check dependency security advisories (no deployment)
        run: npm audit --audit-level=high --prefix staging/wp-content/plugins/ktk-storefront/frontend
      - name: Storefront unit tests
        run: npm test --prefix staging/wp-content/plugins/ktk-storefront/frontend
      - name: Guarded publisher unit tests (no deployment)
        run: |
          php --version
          php -l tools/code-pages-update-engine.php
          php -l tools/staging-protected-state-template.php
          php -l tools/staging-full-inventory-capacity-template.php
          php -l tools/staging-protected-state-core.php
          python tools/build-production-state-core.py
          php -l tools/production-protected-state-core.php
          php -l tools/production-protected-fingerprint.php
          php -l tools/content-update-request.php
          php -l tools/content-update-private-store.php
          php -l tools/content-update-preparation-seeds.php
          php -l tools/content-update-streaming-seeds.php
          php -l tools/full-private-seed-rehearsal.php
          php -l tools/full-private-seed-staging-template.php
          php -l tools/private-seed-disposal.php
          php -l tools/private-seed-disposal-template.php
          php -l tools/staging-private-entry-probe-template.php
          php -l tools/full-private-engine-preparation.php
          php -l tools/full-private-engine-staging-template.php
          php -l tools/full-private-engine-disposal.php
          php -l tools/full-private-engine-disposal-template.php
          php -l tools/content-update-backup-manifest.php
          php -l tools/content-update-controller.php
          php -l tools/content-update-staging-template.php
          php -l tools/staging-private-fixture.php
          php -l tools/staging-private-rehearsal-template.php
          python -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Shared JavaScript contracts
        run: node --test tools/tests/test_booking_destinations.mjs tools/tests/test_homepage_consent.mjs tools/tests/test_code_pages_seo.mjs tools/tests/test_semantic_headings.mjs tools/tests/test_canonical_links.mjs tools/tests/test_code_page_template.mjs tools/tests/test_homepage_media_policy.mjs tools/tests/test_search_console_delivery.mjs tools/tests/test_code_pages_schema.mjs tools/tests/test_read_only_http.mjs tools/tests/test_content_accessibility_styles.mjs tools/tests/test_content_image_descriptions.mjs tools/tests/test_internal_link_graph.mjs tools/tests/test_content_booking_events.mjs tools/tests/test_nightlife_editorial.mjs tools/tests/test_budget_editorial.mjs tools/tests/test_jazz_editorial.mjs tools/tests/test_music_editorial.mjs tools/tests/test_venue_editorial.mjs tools/tests/test_code_page_sharing.mjs tools/tests/test_site_offer_facts.mjs tools/tests/test_offer_pages_editorial.mjs tools/tests/test_event_promotions.mjs tools/tests/test_safety_inline_images.mjs
      - name: Compact menu focus generation contracts (no deployment)
        run: node --test tools/tests/test_compact_menu_focus_styles.mjs
      - name: Homepage full icon font contracts (no conversion or deployment)
        run: node --test tools/tests/test_homepage_icon_font.mjs tools/tests/test_homepage_social_font.mjs
      - name: Memorial visitor-guide source contracts
        run: node --test tools/tests/test_memorial_editorial.mjs
      - name: Memorial phone text contracts
        run: node --test tools/tests/test_memorial_phone_text_styles.mjs
      - name: Historical guide text and original image geometry contracts
        run: node --test tools/tests/test_guide_type_image_styles.mjs
      - name: Reviewed venue phone text generation contracts
        run: node --test tools/tests/test_venue_phone_text_styles.mjs
      - name: Original legal mobile text style contracts
        run: node --test tools/tests/test_legal_mobile_text_styles.mjs
      - name: Contact directions and offer source contracts
        run: node --test tools/tests/test_contact_details.mjs
      - name: Read-only query and landing-page reporting contracts
        run: node --test tools/tests/test_search_query_landing_cohorts.mjs
      - name: Established NYE guide source contracts
        run: node --test tools/tests/test_established_nye_editorial.mjs
      - name: Group planning source contracts
        run: node --test tools/tests/test_group_planning_editorial.mjs
      - name: Group activity source contracts
        run: node --test tools/tests/test_group_activities_editorial.mjs
      - name: Stag activity copy clarity source contracts
        run: node --test tools/tests/test_stag_activity_clarity.mjs
      - name: Stag costume source contracts
        run: node --test tools/tests/test_stag_costume_editorial.mjs
      - name: Practical party-guide source contracts
        run: node --test tools/tests/test_practical_guides_editorial.mjs
      - name: Practical night-out source contracts
        run: node --test tools/tests/test_night_out_editorial.mjs
      - name: Reviewed article presentation contracts
        run: node --test tools/tests/test_reviewed_article_presentation.mjs tools/tests/test_reviewed_article_audit_links.mjs
      - name: Practical safety-guide source contracts
        run: node --test tools/tests/test_safety_guides_editorial.mjs
      - name: Party advice and offer source contracts
        run: node --test tools/tests/test_party_guide_editorial.mjs
      - name: Games resource source contracts
        run: node --test tools/tests/test_games_resource_editorial.mjs
      - name: Budget travel source contracts
        run: node --test tools/tests/test_budget_travel_editorial.mjs tools/tests/test_code_pages_build_completion.mjs
      - name: City and weekend trip source contracts
        run: node --test tools/tests/test_city_trip_editorial.mjs tools/tests/test_owned_vodka_links.mjs
      - name: Karting guide source contracts
        run: node --test tools/tests/test_karting_guides_editorial.mjs
      - name: Weather and winter guide source contracts
        run: node --test tools/tests/test_weather_winter_editorial.mjs
      - name: Food guide source contracts
        run: node --test tools/tests/test_food_guide_editorial.mjs
      - name: Sports, wine and karaoke source contracts
        run: node --test tools/tests/test_nightlife_choice_editorial.mjs
      - name: Stag organiser, activities and team outing source contracts
        run: node --test tools/tests/test_group_choice_editorial.mjs
      - name: Escape-room and shooting booking source contracts
        run: node --test tools/tests/test_activity_booking_editorial.mjs
      - name: Active competition and historical newsletter source contracts
        run: node --test tools/tests/test_competition_newsletter_editorial.mjs
      - name: Guide-life and hen-trip planning source contracts
        run: node --test tools/tests/test_party_trip_editorial.mjs
      - name: European pub crawl and Budapest comparison source contracts
        run: node --test tools/tests/test_nightlife_comparison_editorial.mjs
      - name: Europe article header presentation contracts
        run: node --test tools/tests/test_europe_header_presentation.mjs
      - name: Category archive navigation contracts
        run: node --test tools/tests/test_category_navigation.mjs
      - name: Homepage alias excerpt contracts
        run: node --test tools/tests/test_homepage_alias_excerpts.mjs
      - name: Secondary Christmas and NYE planning contracts
        run: node --test tools/tests/test_secondary_nye_editorial.mjs
      - name: Verify reading-style preservation
        run: node --test tools/tests/test_reviewed_guide_text_styles.mjs tools/tests/test_reviewed_site_text_styles.mjs tools/tests/test_preserved_reading_text_styles.mjs tools/tests/test_short_viewport_booking_styles.mjs
      - name: Hen planning and historical bars source contracts
        run: node --test tools/tests/test_hen_bars_editorial.mjs
      - name: Historical hotel shortlist and spa planning source contracts
        run: node --test tools/tests/test_hotel_guides_editorial.mjs
      - name: Code-page reduced-motion style contracts
        run: node --test tools/tests/test_slider_motion_styles.mjs
      - name: Blog teaser and group enquiry source contracts
        run: node --test tools/tests/test_blog_group_editorial.mjs
      - name: Operator identity and review fallback source contracts
        run: node --test tools/tests/test_operator_trust_editorial.mjs
      - name: Withheld embed alternative source contracts
        run: node --test tools/tests/test_embed_fallbacks.mjs
      - name: Jobs page heading and typography contracts
        run: node --test tools/tests/test_jobs_page_accessibility.mjs
      - name: Stag and NYE mobile text contracts
        run: node --test tools/tests/test_stag_nye_text_styles.mjs
      - name: Preserved Stag mobile text contracts
        run: node --test tools/tests/test_stag_reviewed_text_styles.mjs
      - name: No-JS navigation source contracts
        run: |
          node --test tools/tests/test_nojs_navigation.mjs tools/tests/test_read_only_browser_navigation.mjs
          node tools/test-nojs-navigation-fixtures.mjs "$RUNNER_TEMP/nojs-navigation-fixtures.json"
      - name: Booking selection recovery contracts
        run: node --test tools/tests/test_booking_selection_recovery.mjs tools/tests/test_blocked_meta_pageview.mjs
      - name: Read-only booking measurement contracts (no provider events)
        run: node --test tools/tests/test_booking_measurement.mjs
      - name: PHP syntax and isolated integration contracts
        run: |
          php --version
          find staging/wp-content/mu-plugins staging/wp-content/plugins/ktk-storefront -name '*.php' -not -path '*/node_modules/*' -print0 | xargs -0 -n 1 php -l
          php tools/tests/test_storefront_proxy.php
          php tools/tests/test_homepage_integration.php
          php tools/tests/test_code_pages_integration.php
          php tools/tests/test_code_pages_forms.php
          php tools/tests/test_nye_promotions.php
          php tools/tests/test_clarity_policy.php
          php tools/tests/test_seo_discovery.php
          php tools/tests/test_storefront_public_content.php
      - name: Build storefront (never uploads or deploys)
        run: npm run build --prefix staging/wp-content/plugins/ktk-storefront/frontend

  full_private_engine_fixture:
    name: Full Private Engine Fixture
    if: github.event_name == 'workflow_dispatch' && inputs.full_private_engine_fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Full streamed inventory, inspected cuts, archives, private apply and rollback
        run: |
          php --version
          python tools/verify-full-private-engine-fixture.py --application-commit 029eb40e30d25c12630941a64bce799ff5de8e99 --report docs/seo/full-private-engine-2026-11-16/ci-full-shape.json

  windows_recovery:
    name: Windows Recovery Contracts
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Current-user encrypted recovery contracts (no hosting credentials or deployment)
        run: python -m unittest tools.tests.test_content_update_recovery tools.tests.test_full_private_seed_recovery tools.tests.test_private_seed_disposal_support.DisposalNativeTests tools.tests.test_early_private_recovery.EarlyPrivateNativeTests tools.tests.test_full_private_engine_recovery.FullPrivateEngineNativeTests tools.tests.test_full_private_engine_disposal_support.FullEngineDisposalNativeTests tools.tests.test_unprepared_engine_seed_disposal.UnpreparedEngineDisposalNativeTests tools.tests.test_abandoned_engine_seed_continuation.BatchNativeTests tools.tests.test_private_engine_termination_authority

  secrets:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan checkout without printing secret values
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact --no-banner'
