name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Offline Tests and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: staging/wp-content/plugins/ktk-storefront/frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check tracked-file policy and build inputs
        run: python tools/check-repository.py
      - name: Install locked storefront dependencies
        run: npm ci --prefix staging/wp-content/plugins/ktk-storefront/frontend
      - name: Storefront unit tests
        run: npm test --prefix staging/wp-content/plugins/ktk-storefront/frontend
      - name: Guarded publisher unit tests (no deployment)
        run: python -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Shared JavaScript contracts
        run: node --test tools/tests/test_booking_destinations.mjs tools/tests/test_homepage_consent.mjs
      - name: PHP syntax and isolated integration contracts
        run: |
          php --version
          find staging/wp-content/mu-plugins staging/wp-content/plugins/ktk-storefront -name '*.php' -not -path '*/node_modules/*' -print0 | xargs -0 -n 1 php -l
          php tools/tests/test_storefront_proxy.php
          php tools/tests/test_homepage_integration.php
          php tools/tests/test_code_pages_integration.php
          php tools/tests/test_code_pages_forms.php
          php tools/tests/test_clarity_policy.php
      - name: Build storefront (never uploads or deploys)
        run: npm run build --prefix staging/wp-content/plugins/ktk-storefront/frontend

  secrets:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan checkout without printing secret values
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact --no-banner'
