name: Read-only Capture Calibration

on:
  push:
    branches: ['codex/local-protected-hash-candidate', 'codex/local-linux-capture-buffer-profile']
    paths:
      - '.github/workflows/hash-capture-calibration.yml'
      - 'tools/calibrate_staging_capture.py'
      - 'tools/staging_state_fast_capture.py'
      - 'tools/staging-protected-state-fast-core.php'
      - 'tools/tests/test_staging_state_fast_capture.py'
      - 'tools/tests/test_calibrate_staging_capture.py'

permissions:
  contents: read

concurrency:
  group: capture-calibration-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  read_only_capture:
    name: Complete Capture Equivalence and Timing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify candidate contracts and measure complete synthetic captures
        env:
          CAPTURE_SOURCE_COMMIT: ${{ github.sha }}
          CAPTURE_PROFILE: ${{ github.ref_name == 'codex/local-linux-capture-buffer-profile' && 'bounded32-vs-bounded64' || 'raw-vs-bounded32' }}
        run: |
          php --version
          python -m unittest tools.tests.test_staging_state_fast_capture tools.tests.test_calibrate_staging_capture
          python -m tools.calibrate_staging_capture --source-commit "$CAPTURE_SOURCE_COMMIT" --profile "$CAPTURE_PROFILE" --output docs/seo/fast-capture-local-2026-11-18/ubuntu-calibration
      - name: Preserve complete synthetic observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-calibration-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/seo/fast-capture-local-2026-11-18/ubuntu-calibration/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
