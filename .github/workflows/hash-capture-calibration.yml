name: Read-only Capture Calibration

on:
  push:
    branches: ['codex/offline-capture-debugger-calibration']
    paths:
      - '.github/workflows/hash-capture-calibration.yml'
      - 'tools/calibrate_staging_capture.py'
      - 'tools/staging_state_fast_capture.py'
      - 'tools/staging-protected-state-fast-core.php'
      - 'tools/tests/test_staging_state_fast_capture.py'
      - 'tools/tests/test_calibrate_staging_capture.py'

permissions:
  contents: read

concurrency:
  group: capture-calibration-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  read_only_capture:
    name: Complete Capture Equivalence and Timing
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify candidate contracts and measure complete synthetic captures
        env:
          CAPTURE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          php --version
          for mode in develop off; do
            echo "native-mode=$mode"
            XDEBUG_MODE="$mode" python -m unittest tools.tests.test_staging_state_fast_capture tools.tests.test_calibrate_staging_capture
          done
          output_root=docs/seo/fast-capture-local-2026-11-18/debugger-calibration
          mkdir -p "$output_root"
          for pair in 1 2 3; do
            modes="develop off"
            if [ "$pair" = 2 ]; then modes="off develop"; fi
            for mode in $modes; do
              label="pair-${pair}-${mode}"
              XDEBUG_MODE="$mode" php -r '$m=function_exists("xdebug_info")?xdebug_info("mode"):null;$expected=getenv("XDEBUG_MODE")==="off"?array():array("develop");if(!extension_loaded("xdebug")||$m!==$expected){fwrite(STDERR,"Effective debugger mode not established\n");exit(81);}echo json_encode(array("architecture"=>php_uname("m"),"phpVersion"=>PHP_VERSION,"opensslVersion"=>defined("OPENSSL_VERSION_TEXT")?OPENSSL_VERSION_TEXT:null,"requestedMode"=>getenv("XDEBUG_MODE"),"effectiveModes"=>$m),JSON_UNESCAPED_SLASHES),"\n";' > "$output_root/$label.environment.json"
              XDEBUG_MODE="$mode" python -m tools.calibrate_staging_capture --source-commit "$CAPTURE_SOURCE_COMMIT" --pairs 1 --output "$output_root/$label"
            done
          done
      - name: Preserve complete synthetic observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-debugger-calibration-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/seo/fast-capture-local-2026-11-18/debugger-calibration/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
